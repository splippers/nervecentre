    # --- hand-written routes (not in the registry) ---
    location /amiga/ { proxy_pass http://127.0.0.1:5000/; }

    location = /albert-freethy { return 301 /albert-freethy/; }
    location /albert-freethy/ {
        alias /mnt/SANDIEGO/Projects/albert-freethy/web/;
        index index.html;
    }
    location = /maldon-reborn { return 301 /maldon-reborn/; }
    location /maldon-reborn/ {
        alias /mnt/SANDIEGO/Projects/maldon-reborn/web/;
        index index.html;
    }
    location /maldon-reborn/photos/ { alias /mnt/SANDIEGO/Projects/maldon-reborn/photos/; }

    location = /workadventure { return 301 /workadventure/; }
    location /workadventure/ { return 302 http://play.workadventure.localhost:9080/; }

    location = /nc { return 301 /nc/; }

    # tunnel entry point: nc.splippers.com bare root -> /nc/
    location = / {
        if ($http_host = "nc.splippers.com") { return 301 https://nc.splippers.com/nc/; }
        try_files $uri $uri/ /index.html;
    }

    location = /fleet { return 301 /fleet/; }
    location /fleet/api/ { proxy_pass http://192.168.1.2:8471/api/; }
    location /fleet/ { proxy_pass http://192.168.1.2:8471/fleet/; }

    location /nc/ {
        alias /var/www/splippers-portal/;
        index index.html;
    }

