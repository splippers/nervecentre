    # --- hand-written routes for Marvin (not in the registry) ---
    location = /albert-freethy { return 301 /albert-freethy/; }
    location /albert-freethy/ {
        alias /mnt/SANDIEGO/Projects/albert-freethy/web/;
        index index.html;
        # the page references /img/ from the site root
        sub_filter 'src="/img/' 'src="/albert-freethy/img/';
        sub_filter_once off;
    }
    location = /maldon-reborn { return 301 /maldon-reborn/; }
    location /maldon-reborn/ {
        alias /mnt/SANDIEGO/Projects/maldon-reborn/web/;
        index index.html;
    }
    location /maldon-reborn/photos/ { alias /mnt/SANDIEGO/Projects/maldon-reborn/photos/; }

    location = /workadventure { return 301 /workadventure/; }
    location /workadventure/ { return 302 http://play.workadventure.localhost:9080/; }

    location = /nc { return 301 /nc/; }
    location = / { try_files $uri $uri/ /index.html; }

    location = /fleet { return 301 /fleet/; }
    location /fleet/api/ { proxy_pass http://127.0.0.1:8471/api/; }
    location /fleet/ { proxy_pass http://127.0.0.1:8471/fleet/; }

    location /nc/ {
        alias /var/www/splippers-portal/;
        index index.html;
    }

    # Archive: its PHP app listens on Eddie's loopback only, so go through Eddie's portal
    # (which already rewrites the app's root-relative links under /archive/).
    location = /archive { return 301 /archive/; }
    location /archive/ {
        proxy_pass http://192.168.1.1/archive/;
        proxy_http_version 1.1;
        proxy_set_header Host 192.168.1.1;
        proxy_read_timeout 60s;
    }
