# NerveCentre service registry: the single source of truth.
# Generators read this to produce the nginx server block, landing page and health checks.
#
# host    : eddie | marvin  (see [hosts])
# mode    : proxy    -> nginx proxies /<path>/ to host:port
#           redirect -> 302 to http://<host-ip>:port/  (for apps with absolute asset paths)
# state   : up   = expected to be running
#           down = not running on either host at audit time (2026-10-20); rendered offline, no route
# fw_blocked : true if the port answers on its own host but is dropped by that host's firewall for the LAN
# rewrite : sub_filter prefixes so the app's absolute "/api/" etc. work under /<path>/

[hosts]
eddie  = "192.168.1.1"
marvin = "192.168.1.2"

[[service]]
id = "brickwise"
title = "Brickwise"
group = "Infrastructure"
badge = "Storage"
desc = "Storage / Gluster coordination."
path = "brickwise"
host = "eddie"
port = 8756
mode = "proxy"
timeout = 120
rewrite = ["/api/"]

[[service]]
id = "archive"
title = "Felsted Archives"
group = "Archives"
badge = "Archive"
desc = "Felsted Archives (PHP)."
