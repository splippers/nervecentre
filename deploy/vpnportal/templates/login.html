<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VPN Portal — Login</title>
  <style>
    :root {
      --bg0: #06080c;
      --bg1: #0d1118;
      --edge: rgba(255,255,255,0.06);
      --text: #e9eef5;
      --muted: #94a3b8;
      --vpn: #22d3ee;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 12% -10%, rgba(34,211,238,0.10), transparent 55%),
        linear-gradient(165deg, var(--bg0), var(--bg1) 45%, #05070b);
    }
    .card {
      background: rgba(14,18,26,0.85);
      border: 1px solid var(--edge);
      border-radius: 18px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 18px 44px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }
    input[type="password"] {
      width: 100%;
      padding: 0.65rem 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--edge);
      background: rgba(0,0,0,0.35);
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      margin-bottom: 1.2rem;
    }
    input[type="password"]:focus {
      outline: none;
      border-color: rgba(34,211,238,0.5);
    }
    button {
      width: 100%;
      padding: 0.7rem;
      border-radius: 8px;
      border: 1px solid rgba(34,211,238,0.3);
      background: rgba(34,211,238,0.12);
      color: #22d3ee;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: rgba(34,211,238,0.22); }
    .error {
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.3);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      font-size: 0.85rem;
      color: #f87171;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>VPN Portal</h1>
    <div class="sub">Splippers LAN</div>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post">
      <label for="username">AD username</label>
      <input type="text" id="username" name="username" autofocus autocomplete="username" spellcheck="false" />
      <label for="password" style="margin-top:0.8rem;">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" />
      <button type="submit" style="margin-top:1.2rem;">Sign in</button>
    </form>
  </div>
</body>
</html>
