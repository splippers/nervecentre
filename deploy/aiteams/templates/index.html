<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Teams Portal — Splippers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #06080c; --bg1: #0d1118; --edge: rgba(255,255,255,0.06);
      --text: #e9eef5; --muted: #94a3b8; --accent: #c084fc;
      --card-radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--text);
      background: radial-gradient(1200px 600px at 12% -10%, rgba(192,132,252,0.10), transparent 55%),
                  linear-gradient(165deg, var(--bg0), var(--bg1) 45%, #05070b);
      line-height: 1.45;
    }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 2rem 1.35rem 3rem; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
    header h1 { margin: 0; font-size: 1.75rem; font-weight: 700; letter-spacing: -0.03em; }
    header .sub { color: var(--muted); font-size: 0.95rem; }
    .status-bar { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 2rem; }
    .status-chip { padding: 0.5rem 1rem; border-radius: 999px; border: 1px solid var(--edge); background: rgba(14,18,26,0.72); font-size: 0.85rem; color: var(--muted); }
    .status-chip .num { color: var(--text); font-weight: 700; }
    .card { border-radius: var(--card-radius); border: 1px solid var(--edge); background: rgba(14,18,26,0.72); backdrop-filter: blur(12px); padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 18px 44px rgba(0,0,0,0.35); }
    .card h2 { margin: 0 0 1rem; font-size: 1.2rem; font-weight: 700; }
    .card h3 { margin: 0 0 0.5rem; font-size: 1rem; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th { text-align: left; padding: 0.6rem 0.5rem; color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--edge); }
    td { padding: 0.6rem 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    button, .btn { padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid var(--edge); background: rgba(255,255,255,0.04); color: var(--text); font-family: inherit; font-size: 0.85rem; cursor: pointer; transition: background 0.15s; text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem; }
    button:hover, .btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.15); }
    button.primary { background: rgba(192,132,252,0.12); border-color: rgba(192,132,252,0.3); color: #c084fc; }
    button.primary:hover { background: rgba(192,132,252,0.2); }
    button.danger { background: rgba(248,113,113,0.1); border-color: rgba(248,113,113,0.25); color: #f87171; }
    button.danger:hover { background: rgba(248,113,113,0.2); }
    input, select, textarea { padding: 0.6rem 0.8rem; border-radius: 8px; border: 1px solid var(--edge); background: rgba(0,0,0,0.3); color: var(--text); font-family: inherit; font-size: 0.9rem; width: 100%; }
    textarea { min-height: 60px; resize: vertical; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: rgba(192,132,252,0.5); }
    .modal-overlay { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index:100; align-items:center; justify-content:center; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--bg1); border: 1px solid var(--edge); border-radius: var(--card-radius); padding: 2rem; max-width: 620px; width: 90%; max-height: 85vh; overflow-y: auto; }
    .modal h2 { margin: 0 0 1rem; }
    .modal .close { float: right; background: none; border: none; color: var(--muted); font-size: 1.5rem; cursor: pointer; padding: 0; }
    .modal .close:hover { color: var(--text); }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.3rem; color: var(--muted); font-size: 0.85rem; }
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--edge); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { position: fixed; bottom: 2rem; right: 2rem; padding: 1rem 1.5rem; border-radius: 12px; background: var(--bg1); border: 1px solid var(--edge); z-index: 200; display: none; max-width: 400px; }
    .toast.show { display: block; }
    .toast.error { border-color: rgba(248,113,113,0.4); }
    .toast.success { border-color: rgba(192,132,252,0.4); }
    .badge { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 999px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }
    .badge-idle { background: rgba(148,163,184,0.1); color: #94a3b8; border: 1px solid rgba(148,163,184,0.2); }
    .badge-active { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.3); }
    .badge-working { background: rgba(251,146,60,0.12); color: #fb923c; border: 1px solid rgba(251,146,60,0.3); }
    .member-tag { display: inline-block; padding: 0.15rem 0.5rem; margin: 0.15rem; border-radius: 999px; background: rgba(192,132,252,0.1); border: 1px solid rgba(192,132,252,0.2); font-size: 0.8rem; }
    .team-card { border: 1px solid var(--edge); border-radius: 12px; padding: 1rem; margin-bottom: 1rem; background: rgba(0,0,0,0.15); }
    .project-tag { display: inline-block; padding: 0.15rem 0.5rem; margin: 0.15rem; border-radius: 999px; background: rgba(74,222,128,0.08); border: 1px solid rgba(74,222,128,0.15); font-size: 0.8rem; }
    .tab-bar { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    .tab-bar button { border-radius: 999px; padding: 0.5rem 1.2rem; }
    .tab-bar button.active { background: rgba(192,132,252,0.15); border-color: rgba(192,132,252,0.35); color: #c084fc; }
    .hidden { display: none; }
    .activity-item { padding: 0.5rem 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 0.85rem; }
    .activity-item .time { color: var(--muted); font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>AI Teams Portal</h1>
        <div class="sub">Manage AI teams, assign projects, track activity</div>
      </div>
      <button class="primary" onclick="openCreateTeam()">+ New Team</button>
    </header>

    <div class="status-bar">
      <div class="status-chip">Teams: <span class="num" id="team-count">0</span></div>
      <div class="status-chip">Activity: <span class="num" id="activity-count">{{ activity_count }}</span></div>
    </div>

    <div class="tab-bar">
      <button class="active" onclick="switchTab('teams', this)">Teams</button>
      <button onclick="switchTab('activity', this)">Activity Log</button>
    </div>

    <div id="tab-teams">
      <div class="card" id="teams-container">
        <h2>AI Teams</h2>
        <div style="text-align:center;padding:2rem;"><span class="spinner"></span> Loading teams...</div>
      </div>
    </div>

    <div id="tab-activity" class="hidden">
      <div class="card" id="activity-container">
        <h2>Activity Log</h2>
        <div style="text-align:center;padding:2rem;"><span class="spinner"></span> Loading activity...</div>
      </div>
    </div>
  </div>

  <!-- Create team modal -->
  <div class="modal-overlay" id="team-modal">
    <div class="modal">
      <button class="close" onclick="closeModal('team-modal')">&times;</button>
      <h2 id="team-modal-title">New Team</h2>
      <input type="hidden" id="team-id" />
      <div class="form-group">
        <label>Team Name</label>
        <input type="text" id="team-name" placeholder="e.g. Ghostwriters, Editorial, Dev Team" />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="team-desc" placeholder="What does this team do?"></textarea>
      </div>
      <div class="form-group">
        <label>Members (comma-separated)</label>
        <input type="text" id="team-members" placeholder="e.g. Monya, Char, Marsha" />
      </div>
      <div class="form-group">
        <label>Agent Type</label>
        <select id="team-agent-type">
          <option value="opencode">OpenCode</option>
          <option value="claude">Claude</option>
          <option value="ollama">Ollama</option>
          <option value="orange">Orange</option>
          <option value="custom">Custom</option>
        </select>
      </div>
      <div class="form-group">
        <label>Model</label>
        <input type="text" id="team-model" placeholder="e.g. phi3:latest, qwen2.5:32b" value="phi3:latest" />
      </div>
      <div class="form-group">
        <label>Assigned Projects (comma-separated)</label>
        <input type="text" id="team-projects" placeholder="e.g. thoughtfarm, alzhelper, toybox" />
      </div>
      <button class="primary" onclick="saveTeam()">Save Team</button>
    </div>
  </div>

  <!-- Assign project modal -->
  <div class="modal-overlay" id="assign-modal">
    <div class="modal">
      <button class="close" onclick="closeModal('assign-modal')">&times;</button>
      <h2 id="assign-title">Assign Project</h2>
      <div class="form-group">
        <label>Project Name</label>
        <input type="text" id="assign-project" placeholder="e.g. alzhelper" />
      </div>
      <button class="primary" onclick="assignProject()">Assign</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let teams = [];
    let activity = [];
    let editingTeamId = null;
    let assigningTeamId = null;

    function toast(msg, type) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = 'toast show ' + (type||'success');
      setTimeout(() => { t.className = 'toast'; }, 3000);
    }
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    function switchTab(tab, btn) {
      document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-teams').classList.toggle('hidden', tab !== 'teams');
      document.getElementById('tab-activity').classList.toggle('hidden', tab !== 'activity');
    }

    function statusBadge(s) {
      const cls = 'badge-' + (s || 'idle');
      return `<span class="badge ${cls}">${escapeHtml(s || 'idle')}</span>`;
    }

    function loadTeams() {
      fetch('/api/teams')
        .then(r => r.json())
        .then(data => {
          teams = data;
          document.getElementById('team-count').textContent = teams.length;
          renderTeams();
        })
        .catch(e => {
          document.getElementById('teams-container').innerHTML = '<h2>AI Teams</h2><div class="empty-state" style="color:#f87171;">Error: ' + e.message + '</div>';
        });
    }

    function renderTeams() {
      const container = document.getElementById('teams-container');
      if (!teams.length) {
        container.innerHTML = '<h2>AI Teams</h2><div class="empty-state">No teams yet. Create one to get started.</div>';
        return;
      }
      let html = '<h2>AI Teams</h2>';
      for (const t of teams) {
        const members = (t.members || []).map(m => `<span class="member-tag">${escapeHtml(m)}</span>`).join('');
        const projects = (t.assigned_projects || []).map(p => `<span class="project-tag">${escapeHtml(p)}</span>`).join('');
        html += `<div class="team-card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:0.5rem;">
            <div>
              <strong style="font-size:1.1rem;">${escapeHtml(t.name)}</strong>
              ${statusBadge(t.status)}
            </div>
            <div class="actions">
              <button onclick="editTeam('${t.id}')">Edit</button>
              <button onclick="openAssign('${t.id}')">+ Assign</button>
              <button class="danger" onclick="deleteTeam('${t.id}')">Delete</button>
            </div>
          </div>
          ${t.description ? '<div style="color:var(--muted);font-size:0.85rem;margin-top:0.3rem;">' + escapeHtml(t.description) + '</div>' : ''}
          <div style="margin-top:0.5rem;font-size:0.85rem;color:var(--muted);">
            Agent: <strong>${escapeHtml(t.agent_type)}</strong> · Model: <strong>${escapeHtml(t.model)}</strong>
          </div>
          ${members ? '<div style="margin-top:0.3rem;">' + members + '</div>' : ''}
          ${projects ? '<div style="margin-top:0.3rem;">' + projects + '</div>' : ''}
        </div>`;
      }
      container.innerHTML = html;
    }

    function loadActivity() {
      fetch('/api/activity?limit=100')
        .then(r => r.json())
        .then(data => {
          activity = data;
          document.getElementById('activity-count').textContent = activity.length;
          renderActivity();
        });
    }

    function renderActivity() {
      const container = document.getElementById('activity-container');
      if (!activity.length) {
        container.innerHTML = '<h2>Activity Log</h2><div class="empty-state">No activity yet.</div>';
        return;
      }
      let html = '<h2>Activity Log</h2>';
      for (const a of activity.slice().reverse()) {
        html += `<div class="activity-item">
          <span class="time">${new Date(a.timestamp).toLocaleString()}</span>
          <strong>${escapeHtml(a.action)}</strong> — ${escapeHtml(a.team)}
          ${a.detail ? '<span style="color:var(--muted);"> · ' + escapeHtml(a.detail) + '</span>' : ''}
        </div>`;
      }
      container.innerHTML = html;
    }

    function openCreateTeam() {
      editingTeamId = null;
      document.getElementById('team-modal-title').textContent = 'New Team';
      document.getElementById('team-id').value = '';
      document.getElementById('team-name').value = '';
      document.getElementById('team-desc').value = '';
      document.getElementById('team-members').value = '';
      document.getElementById('team-agent-type').value = 'opencode';
      document.getElementById('team-model').value = 'phi3:latest';
      document.getElementById('team-projects').value = '';
      openModal('team-modal');
    }

    function editTeam(id) {
      const t = teams.find(x => x.id === id);
      if (!t) return;
      editingTeamId = id;
      document.getElementById('team-modal-title').textContent = 'Edit: ' + t.name;
      document.getElementById('team-id').value = id;
      document.getElementById('team-name').value = t.name;
      document.getElementById('team-desc').value = t.description || '';
      document.getElementById('team-members').value = (t.members || []).join(', ');
      document.getElementById('team-agent-type').value = t.agent_type || 'opencode';
      document.getElementById('team-model').value = t.model || 'phi3:latest';
      document.getElementById('team-projects').value = (t.assigned_projects || []).join(', ');
      openModal('team-modal');
    }

    function saveTeam() {
      const data = {
        name: document.getElementById('team-name').value.trim(),
        description: document.getElementById('team-desc').value.trim(),
        members: document.getElementById('team-members').value.split(',').map(s => s.trim()).filter(Boolean),
        agent_type: document.getElementById('team-agent-type').value,
        model: document.getElementById('team-model').value.trim(),
        assigned_projects: document.getElementById('team-projects').value.split(',').map(s => s.trim()).filter(Boolean),
      };
      if (!data.name) { toast('Enter a team name', 'error'); return; }

      const id = document.getElementById('team-id').value;
      const url = id ? '/api/teams/' + id : '/api/teams';
      const method = id ? 'PUT' : 'POST';

      fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) })
        .then(r => r.json())
        .then(d => {
          if (d.error) { toast(d.error, 'error'); return; }
          toast('Team ' + (id ? 'updated' : 'created'));
          closeModal('team-modal');
          loadTeams(); loadActivity();
        })
        .catch(e => toast('Error: ' + e.message, 'error'));
    }

    function deleteTeam(id) {
      const t = teams.find(x => x.id === id);
      if (!confirm('Delete team "' + t.name + '"?')) return;
      fetch('/api/teams/' + id, { method: 'DELETE' })
        .then(r => r.json())
        .then(() => { toast('Team deleted'); loadTeams(); loadActivity(); })
        .catch(e => toast('Error: ' + e.message, 'error'));
    }

    function openAssign(id) {
      assigningTeamId = id;
      const t = teams.find(x => x.id === id);
      document.getElementById('assign-title').textContent = 'Assign Project — ' + t.name;
      document.getElementById('assign-project').value = '';
      openModal('assign-modal');
    }

    function assignProject() {
      const project = document.getElementById('assign-project').value.trim();
      if (!project) { toast('Enter a project name', 'error'); return; }
      fetch('/api/teams/' + assigningTeamId + '/assign', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ project }),
      })
        .then(r => r.json())
        .then(d => {
          if (d.error) { toast(d.error, 'error'); return; }
          toast('Project assigned');
          closeModal('assign-modal');
          loadTeams(); loadActivity();
        })
        .catch(e => toast('Error: ' + e.message, 'error'));
    }

    loadTeams();
    loadActivity();
    setInterval(loadActivity, 15000);
  </script>
</body>
</html>
